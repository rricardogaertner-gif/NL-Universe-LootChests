
name: Build NL-Universe LootChests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          echo "Available Gradle files:"
          find . -name build.gradle -o -name settings.gradle
          BUILD_FILE=$(find . -name build.gradle -type f -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No build.gradle found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Build plugin
        run: gradle -p "${{ steps.project.outputs.dir }}" build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NL-Universe-LootChests
          path: '**/build/libs/*.jar'
          if-no-files-found: error
