name: NLUniverseLootChests
version: '1.0.0'
main: nl.universe.loot.LootChestsPlugin
api-version: '1.21'
author: NL-Universe
description: Random loot chests in selected survival worlds
commands:
  nlloot:
    description: Manage NL-Universe loot chests
    usage: /nlloot <status|spawn|reload>
permissions:
  nlloot.admin:
    description: Manage loot chests
    default: op
