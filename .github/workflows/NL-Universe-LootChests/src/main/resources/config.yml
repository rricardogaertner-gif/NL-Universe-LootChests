# Change 'vanilla' to 'vanille' if that is the EXACT world name on your server.
worlds:
  - vanilla
  - smp
spawn-interval-minutes: 30
max-active-per-world: 5
min-distance: 500
max-distance: 900
spawn-search-attempts: 90
# If there are no existing loot chests, the first chest spawns 500-900 blocks from an online player.
# Subsequent chests spawn 500-900 blocks from an existing loot chest.
announce-spawns: false
